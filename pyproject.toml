[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixrep"
dynamic = ["version"]
description = "Convert code repositories into structured PDF collections for LLM collaboration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=3.6",
]

[project.optional-dependencies]
png = [
    "PyMuPDF>=1.23",
    "Pillow>=9.0",
]

[project.scripts]
pixrep = "pixrep.cli:main"

[tool.setuptools]
packages = ["pixrep"]

[tool.setuptools.dynamic]
version = {attr = "pixrep.version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
